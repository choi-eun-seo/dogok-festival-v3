  <head>

    <style>
      /* Design bases: PC 1920 / Mobile 360 · Breakpoint: 768 */
      :root {
        --header-height: 90px;
        --header-color: #ad6634;
        /* --page-color: #c28251; */
        --text-color: #fff;
        --content-width: 1240px;
        --page-gutter: 48px;
        --design-width: 1920;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--page-color);
        color: var(--text-color);
        font-family:
          Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
        height: var(--header-height);
        background: var(--header-color);
      }

      .header-inner {
        width: min(var(--content-width), calc(100% - var(--page-gutter) * 2));
        height: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 13px;
        flex: none;
      }

      .brand-icon {
        width: 38px;
        height: 34px;
      }

      .brand-title {
        display: block;
        width: 391px;
        height: 29px;
        object-fit: contain;
      }

      .header-nav ul {
        display: flex;
        align-items: center;
        gap: 34px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .header-nav a {
        position: relative;
        display: block;
        padding: 12px 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      .header-nav a::after {
        position: absolute;
        right: 0;
        bottom: 3px;
        left: 0;
        height: 2px;
        background: currentColor;
        content: "";
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 180ms ease;
      }

      .header-nav a:hover::after,
      .header-nav a:focus-visible::after {
        transform: scaleX(1);
      }

      .menu-toggle {
        display: none;
        width: 42px;
        height: 42px;
        padding: 9px;
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }

      .menu-toggle span {
        display: block;
        width: 24px;
        height: 2px;
        margin: 5px 0;
        background: currentColor;
        transition:
          transform 180ms ease,
          opacity 180ms ease;
      }

      .menu-toggle[aria-expanded="true"] span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }

      .menu-toggle[aria-expanded="true"] span:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle[aria-expanded="true"] span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      main {
        width: 100%;
      }

      main section {
        padding: 0;
        scroll-margin-top: var(--header-height);
      }

      .visual-frame,
      .main-visual {
        display: block;
        width: 100%;
        height: auto;
      }

      .mo-only {
        display: none;
      }

      .pc-only {
        display: block;
      }

      .program-mo {
        position: relative;
        background: #fff;
      }

      .program-mo > .main-visual {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Mobile scroll strips · positions from mo-program 360x4795 */
      .mo-hscroll {
        position: absolute;
        left: 0;
        width: 100%;
        background: #fff;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
      }

      .mo-hscroll img {
        display: block;
        height: 100%;
        width: auto;
        max-width: none;
        margin-left: calc(20 / 360 * 100%);
        margin-right: calc(20 / 360 * 100%);
      }

      .mo-hscroll--flea {
        top: calc(836 / 4795 * 100%);
        height: calc(253 / 4795 * 100%);
      }

      .mo-hscroll--play {
        top: calc(1630 / 4795 * 100%);
        height: calc(265 / 4795 * 100%);
      }

      .mo-hscroll--food {
        top: calc(2471 / 4795 * 100%);
        height: calc(253 / 4795 * 100%);
      }

      /* Mobile · design width 360 */
      @media (max-width: 767px) {
        :root {
          --header-height: 56px;
          --content-width: 328px;
          --page-gutter: 16px;
          --design-width: 360;
        }

        body {
          max-width: 100vw;
          overflow-x: hidden;
        }

        .pc-only {
          display: none;
        }

        .header-inner {
          width: 100%;
          max-width: none;
          margin: 0;
          padding: 0 var(--page-gutter);
          justify-content: space-between;
        }

        .brand {
          gap: 8px;
          margin-right: auto;
          justify-content: flex-start;
        }

        .brand-icon {
          width: 28px;
          height: auto;
        }

        .brand-title {
          width: min(240px, calc(100vw - 88px));
          height: auto;
          object-fit: contain;
          object-position: left center;
        }

        .menu-toggle {
          display: block;
          width: 40px;
          height: 40px;
          padding: 8px;
        }

        .header-nav {
          position: absolute;
          top: 100%;
          right: 0;
          left: 0;
          z-index: 101;
          overflow: hidden;
          max-height: 0;
          background: var(--header-color);
          transition: max-height 220ms ease;
        }

        .header-nav.is-open {
          max-height: 240px;
        }

        .header-nav ul {
          display: block;
          width: calc(100% - var(--page-gutter) * 2);
          max-width: 360px;
          margin: 0 auto;
          padding: 4px 0 16px;
        }

        .header-nav a {
          padding: 12px 2px;
          font-size: 15px;
        }

        .header-nav a::after {
          display: none;
        }

        main section {
          scroll-margin-top: var(--header-height);
        }

        .visual-frame,
        .main-visual {
          width: 100%;
          height: auto;
        }

        .mo-only {
          display: block;
        }

        .program-mo.mo-only {
          display: block;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a
          class="brand"
          href="#event-intro"
          aria-label="도곡 메타세쿼이아 로드 페스타 홈"
        >
          <img
            class="brand-title"
            src="https://cdn.jejodo.life/dogok/contest/2026/header-title.svg"
            alt="도곡 메타세쿼이아 로드 페스타"
          />
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="메뉴 열기"
          aria-expanded="false"
          aria-controls="header-navigation"
        >
          <span></span><span></span><span></span>
        </button>

        <nav class="header-nav" id="header-navigation" aria-label="주요 메뉴">
          <ul>
            <li><a href="#event-intro">행사 소개</a></li>
            <li><a href="#venue-map">행사장 지도</a></li>
            <li><a href="#program">프로그램 소개</a></li>
            <li><a href="#directions">오시는 길</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section id="event-intro" aria-label="행사 소개">
        <picture class="visual-frame">
          <source media="(max-width: 767px)" srcset="https://cdn.jejodo.life/dogok/contest/2026/mo-main.svg" />
          <img
            class="main-visual"
            src="https://cdn.jejodo.life/dogok/contest/2026/main.svg"
            alt="도곡 메타세쿼이아 로드 페스타"
          />
        </picture>
      </section>
      <section id="venue-map" aria-label="행사장 지도">
        <picture class="visual-frame">
          <source media="(max-width: 767px)" srcset="https://cdn.jejodo.life/dogok/contest/2026/mo-map.svg" />
          <img class="main-visual" src="https://cdn.jejodo.life/dogok/contest/2026/map.svg" alt="행사장 지도" />
        </picture>
      </section>
      <section id="program" aria-label="프로그램 소개">
        <img
          class="main-visual pc-only"
          src="https://cdn.jejodo.life/dogok/contest/2026/program.svg"
          alt="프로그램 소개"
        />
        <div class="program-mo mo-only">
          <img
            class="main-visual"
            src="https://cdn.jejodo.life/dogok/contest/2026/mo-program.svg"
            alt="프로그램 소개"
          />
          <div class="mo-hscroll mo-hscroll--flea" aria-label="플리마켓 목록">
            <img
              src="https://cdn.jejodo.life/dogok/contest/2026/mo-flea.svg"
              alt="플리마켓"
              width="1112"
              height="253"
            />
          </div>
          <div class="mo-hscroll mo-hscroll--play" aria-label="공연 목록">
            <img
              src="https://cdn.jejodo.life/dogok/contest/2026/mo-play.svg"
              alt="공연 프로그램"
              width="792"
              height="265"
            />
          </div>
          <div class="mo-hscroll mo-hscroll--food" aria-label="먹거리 목록">
            <img
              src="https://cdn.jejodo.life/dogok/contest/2026/mo-food.svg"
              alt="푸드 프로그램"
              width="472"
              height="253"
            />
          </div>
        </div>
      </section>
      <section id="directions" aria-label="오시는 길">
        <picture class="visual-frame">
          <source media="(max-width: 767px)" srcset="https://cdn.jejodo.life/dogok/contest/2026/mo-outro.svg" />
          <img class="main-visual" src="https://cdn.jejodo.life/dogok/contest/2026/outro.svg" alt="오시는 길" />
        </picture>
      </section>
      <section id="footer" aria-label="푸터">
        <picture class="visual-frame">
          <source media="(max-width: 767px)" srcset="https://cdn.jejodo.life/dogok/contest/2026/mo-footer.svg" />
          <img class="main-visual" src="https://cdn.jejodo.life/dogok/contest/2026/footer.svg" alt="푸터" />
        </picture>
      </section>
    </main>

    <script>
      const menuButton = document.querySelector(".menu-toggle");
      const navigation = document.querySelector(".header-nav");
      const sections = [...document.querySelectorAll("main section")];
      const navLinks = [...navigation.querySelectorAll("a[href^='#']")];
      const brandLink = document.querySelector(".brand");

      function closeMenu() {
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "메뉴 열기");
        navigation.classList.remove("is-open");
      }

      function showSection(sectionId) {
        const target =
          sections.find((section) => section.id === sectionId) || sections[0];
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function getSectionIdFromHash(hash) {
        const id = (hash || "").replace(/^#/, "");
        return sections.some((section) => section.id === id)
          ? id
          : sections[0].id;
      }

      menuButton.addEventListener("click", () => {
        const isOpen = menuButton.getAttribute("aria-expanded") === "true";
        menuButton.setAttribute("aria-expanded", String(!isOpen));
        menuButton.setAttribute(
          "aria-label",
          isOpen ? "메뉴 열기" : "메뉴 닫기",
        );
        navigation.classList.toggle("is-open", !isOpen);
      });

      function handleNavClick(event) {
        const link = event.currentTarget;
        const sectionId = getSectionIdFromHash(link.getAttribute("href"));

        event.preventDefault();
        history.replaceState(null, "", `#${sectionId}`);
        showSection(sectionId);
        closeMenu();
      }

      navLinks.forEach((link) =>
        link.addEventListener("click", handleNavClick),
      );
      brandLink.addEventListener("click", handleNavClick);

      window.addEventListener("hashchange", () => {
        showSection(getSectionIdFromHash(location.hash));
        closeMenu();
      });
    </script>
  </body>
</html>
